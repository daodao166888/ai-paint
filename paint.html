<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paint · Portrait study</title>
<style>
  :root{
    --bg:#ebe6df; --bar:#f7f5f1; --line:#e2ddd5; --ink:#2b2622; --muted:#8c847b;
    --accent:#b4553a; --accent-bg:#f3ddd3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
  .top{height:52px;background:var(--bar);border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 16px;gap:10px}
  .logo{width:26px;height:26px;border-radius:6px;background:#6b3a2a;display:grid;place-items:center}
  .logo svg{width:15px;height:15px}
  .title{font-weight:650;font-size:16px}
  .sub{color:var(--muted);margin-left:8px}
  .btn{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:6px;
    padding:6px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
  .tools{height:52px;background:var(--bar);border-bottom:1px solid var(--line);
    display:flex;align-items:center;padding:0 16px;gap:6px;color:var(--muted);font-size:12px}
  .tool{background:var(--accent-bg);color:var(--accent);font-weight:600;border-radius:6px;padding:6px 10px;margin-right:10px}
  .size{min-width:26px;text-align:center;padding:5px 4px;border-radius:5px;border:1px solid transparent;color:#5d5650}
  .size.on{border-color:#d6d0c7;background:#fff;color:var(--ink);font-weight:700}
  .colorbox{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
    border-radius:6px;padding:3px 8px 3px 4px;margin-left:16px;font-family:ui-monospace,Menlo,monospace;color:#5d5650}
  .sw{width:18px;height:18px;border-radius:4px;background:#999;border:1px solid rgba(0,0,0,.08)}
  .stage{display:flex;gap:16px;padding:16px}
  .canvasWrap{position:relative}
  canvas#c{display:block;width:660px;height:700px;background:#f8f7f4;border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:8px}
  .cursor{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
    border:1.5px solid rgba(60,50,45,.75);pointer-events:none;display:none}
  .cursor::after{content:"";position:absolute;inset:3.5px;border-radius:50%;border:1px solid rgba(60,50,45,.6)}
  .side{width:226px}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .card h4{margin:0;padding:8px 10px;font-size:11px;font-weight:650;border-bottom:1px solid var(--line);
    display:flex;gap:6px;align-items:center}
  .card .ref{width:100%;aspect-ratio:825/875;object-fit:cover;display:block;background:#eee}
  .passTitle{margin:20px 0 6px;font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:650}
  .pass{display:flex;align-items:center;gap:7px;font-size:12px}
  .pass i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .panel{margin-top:22px;font-size:12px;color:var(--muted)}
  .panel button,.panel input{font:inherit}
  .panel .row{margin:6px 0}
  body.rec .panel{display:none}
</style>
</head>
<body>
<div class="top">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M14 4l6 6-9 9H5v-6z"/><path d="M12 6l6 6"/></svg></div>
  <span class="title">Paint</span><span class="sub">Portrait study</span>
  <button class="btn" id="save">Save PNG</button>
</div>
<div class="tools">
  <span class="tool">Brush</span>
  <span>Size</span>
  <span id="sizes"></span>
  <span class="colorbox"><span class="sw" id="sw"></span><span id="hex"># 999495</span></span>
</div>
<div class="stage">
  <div>
    <div class="canvasWrap">
      <canvas id="c"></canvas>
      <div class="cursor" id="cur"></div>
    </div>
    <div class="meta"><span>825 × 875 px</span><span>80%</span></div>
  </div>
  <div class="side">
    <div class="card">
      <h4><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>Reference</h4>
      <img class="ref" id="refImg" alt="">
    </div>
    <div class="passTitle">PAINTING PASS</div>
    <div class="pass"><i></i><span id="pass">Ready</span></div>

    <div class="panel">
      <div class="row"><input type="file" id="file" accept="image/*"></div>
      <div class="row">Duration <input id="dur" type="number" value="30" min="5" style="width:52px"> s</div>
      <div class="row"><button id="go">Start painting</button> <button id="reset">Reset</button></div>
      <div class="row" style="line-height:1.5">Drop an image anywhere, or use<br><code>?ref=img.jpg&amp;autostart=1&amp;rec=1</code></div>
    </div>
  </div>
</div>

<script>
/* ---------- constants ---------- */
const params = new URLSearchParams(location.search);
const S = Math.max(1, +params.get('scale') || 2);   // internal resolution multiplier (crisper output)
const W = 825 * S, H = 875 * S;                        // internal canvas pixels
const MANUAL = params.has('manual');                   // frame-by-frame driven by recorder
const SIZES = [126, 69, 38, 21, 12, 7, 4, 3];
const PASS_OF = s => s >= 69 ? 'Block-in' : s >= 21 ? 'Form and color' : s >= 7 ? 'Refinement' : 'Fine details';

const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d', { willReadFrequently: true });
const cur = document.getElementById('cur');
if (params.has('rec')) document.body.classList.add('rec');

/* ---------- toolbar UI ---------- */
const sizesEl = document.getElementById('sizes');
sizesEl.innerHTML = SIZES.map(s => `<span class="size" data-s="${s}">${s}</span>`).join(' ');
function uiSize(s){
  for (const el of sizesEl.children) el.classList.toggle('on', +el.dataset.s === s);
}
function uiColor(hex){
  document.getElementById('sw').style.background = hex;
  document.getElementById('hex').textContent = '# ' + hex.slice(1);
}
function uiPass(t){ document.getElementById('pass').textContent = t; }
function uiCursor(x, y){
  cur.style.display = 'block';
  cur.style.left = (x / W * cv.clientWidth + 1) + 'px';
  cur.style.top  = (y / H * cv.clientHeight + 1) + 'px';
}
function clearCanvas(){ ctx.fillStyle = '#f8f7f4'; ctx.fillRect(0, 0, W, H); }
clearCanvas(); uiSize(SIZES[0]);

/* ---------- reference loading (cover-fit to 825x875) ---------- */
let refData = null;                // Uint8ClampedArray RGBA of reference at W x H
function loadRef(src){
  return new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const o = document.createElement('canvas'); o.width = W; o.height = H;
      const g = o.getContext('2d');
      const k = Math.max(W / img.width, H / img.height);
      const w = img.width * k, h = img.height * k;
      g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
      refData = g.getImageData(0, 0, W, H).data;
      document.getElementById('refImg').src = o.toDataURL('image/jpeg', .92);
      res();
    };
    img.onerror = rej;
    img.src = src;
  });
}

/* ---------- low-level brush API (also used by the AI agent) ---------- */
const state = { size: SIZES[0], color: '#999495' };
const hex2 = v => v.toString(16).padStart(2, '0');
const toHex = (r, g, b) => '#' + hex2(r) + hex2(g) + hex2(b);

function setBrush(size){ state.size = size; uiSize(size); }
function setColor(hex){ state.color = hex; uiColor(hex); }
function setPass(name){ uiPass(name); }
/** points: [[x,y], ...] in canvas pixels (825x875). One point = a dab. */
function stroke(points, opts = {}){
  if (!points.length) return;
  if (!opts.raw) points = points.map(([x, y]) => [x * S, y * S]);
  const r = state.size * S;
  ctx.save();
  ctx.globalAlpha = opts.alpha ?? 0.92;
  ctx.strokeStyle = ctx.fillStyle = state.color;
  ctx.lineCap = ctx.lineJoin = 'round';
  ctx.lineWidth = r;
  if (points.length === 1) {
    // irregular dab: an ellipse with a little random rotation looks more like paint
    const [x, y] = points[0];
    ctx.beginPath();
    ctx.ellipse(x, y, r / 2, r / 2 * (0.75 + Math.random() * .25), Math.random() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length - 1; i++) {
      const mx = (points[i][0] + points[i + 1][0]) / 2, my = (points[i][1] + points[i + 1][1]) / 2;
      ctx.quadraticCurveTo(points[i][0], points[i][1], mx, my);
    }
    const last = points[points.length - 1];
    ctx.lineTo(last[0], last[1]);
    ctx.stroke();
  }
  ctx.restore();
  const p = points[points.length - 1];
  uiCursor(p[0], p[1]);
}
function snapshot(small){
  if (!small) return cv.toDataURL('image/png');
  const o = document.createElement('canvas'); o.width = 825; o.height = 875;   // model-friendly size
  o.getContext('2d').drawImage(cv, 0, 0, 825, 875);
  return o.toDataURL('image/jpeg', .9);
}
function referenceSmall(){
  const o = document.createElement('canvas'); o.width = 825; o.height = 875;
  o.getContext('2d').drawImage(document.getElementById('refImg'), 0, 0, 825, 875);
  return o.toDataURL('image/jpeg', .9);
}

/* ---------- helpers for the auto painter ---------- */
// separable box blur of the reference, returns Float32Array RGB (3 channels)
function blurRef(radius){
  const n = W * H, src = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { src[i*3] = refData[i*4]; src[i*3+1] = refData[i*4+1]; src[i*3+2] = refData[i*4+2]; }
  if (radius < 1) return src;
  const tmp = new Float32Array(n * 3), out = new Float32Array(n * 3), d = 2 * radius + 1;
  for (let y = 0; y < H; y++) {             // horizontal
    for (let c = 0; c < 3; c++) {
      let acc = 0;
      for (let k = -radius; k <= radius; k++) acc += src[(y * W + Math.min(W - 1, Math.max(0, k))) * 3 + c];
      for (let x = 0; x < W; x++) {
        tmp[(y * W + x) * 3 + c] = acc / d;
        const a = Math.min(W - 1, x + radius + 1), b = Math.max(0, x - radius);
        acc += src[(y * W + a) * 3 + c] - src[(y * W + b) * 3 + c];
      }
    }
  }
  for (let x = 0; x < W; x++) {             // vertical
    for (let c = 0; c < 3; c++) {
      let acc = 0;
      for (let k = -radius; k <= radius; k++) acc += tmp[(Math.min(H - 1, Math.max(0, k)) * W + x) * 3 + c];
      for (let y = 0; y < H; y++) {
        out[(y * W + x) * 3 + c] = acc / d;
        const a = Math.min(H - 1, y + radius + 1), b = Math.max(0, y - radius);
        acc += tmp[(a * W + x) * 3 + c] - tmp[(b * W + x) * 3 + c];
      }
    }
  }
  return out;
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

/**
 * Plan one layer (Hertzmann-style painterly rendering):
 * grid over the canvas, in each cell compare canvas vs blurred reference;
 * where error is high, start a curved stroke that follows the image's
 * iso-luminance direction until the colour stops matching.
 */
function planLayer(R, first){
  const P = R * S;                                   // brush diameter in internal px
  const ref = blurRef(Math.max(1, Math.round(P / 3)));
  const cur = ctx.getImageData(0, 0, W, H).data;
  const lum = i => 0.3 * ref[i*3] + 0.59 * ref[i*3+1] + 0.11 * ref[i*3+2];
  const grid = Math.max(2, Math.round(P * 0.55));
  const T = first ? -1 : (R >= 21 ? 22 : R >= 7 ? 16 : 12);    // error threshold
  const maxLen = R >= 21 ? 6 : R >= 7 ? 8 : 5;
  const strokes = [];
  for (let gy = 0; gy < H; gy += grid) for (let gx = 0; gx < W; gx += grid) {
    let sum = 0, cnt = 0, best = -1, bx = gx, by = gy;
    for (let y = gy; y < Math.min(H, gy + grid); y += 1 + (grid > 12)) for (let x = gx; x < Math.min(W, gx + grid); x += 1 + (grid > 12)) {
      const i = y * W + x;
      const e = Math.hypot(cur[i*4] - ref[i*3], cur[i*4+1] - ref[i*3+1], cur[i*4+2] - ref[i*3+2]);
      sum += e; cnt++;
      if (e > best) { best = e; bx = x; by = y; }
    }
    if (sum / cnt <= T) continue;
    // build curved stroke
    const i0 = by * W + bx;
    const col = [ref[i0*3], ref[i0*3+1], ref[i0*3+2]];
    const pts = [[bx, by]];
    let x = bx, y = by, ldx = 0, ldy = 0;
    if (R < 126) for (let k = 1; k < maxLen; k++) {
      const xi = Math.min(W - 2, Math.max(1, x | 0)), yi = Math.min(H - 2, Math.max(1, y | 0));
      const gxv = lum(yi * W + xi + 1) - lum(yi * W + xi - 1);
      const gyv = lum((yi + 1) * W + xi) - lum((yi - 1) * W + xi);
      if (Math.hypot(gxv, gyv) < 1.2) break;
      let dx = -gyv, dy = gxv;                       // perpendicular to gradient
      if (dx * ldx + dy * ldy < 0) { dx = -dx; dy = -dy; }
      const m = Math.hypot(dx, dy); dx /= m; dy /= m;
      if (k > 1) { dx = .5 * dx + .5 * ldx; dy = .5 * dy + .5 * ldy; const m2 = Math.hypot(dx, dy); dx /= m2; dy /= m2; }
      x += dx * P * 0.5; y += dy * P * 0.5;
      if (x < 0 || y < 0 || x >= W || y >= H) break;
      const j = (y | 0) * W + (x | 0);
      const dRef = Math.hypot(ref[j*3] - col[0], ref[j*3+1] - col[1], ref[j*3+2] - col[2]);
      const dCan = Math.hypot(ref[j*3] - cur[j*4], ref[j*3+1] - cur[j*4+1], ref[j*3+2] - cur[j*4+2]);
      if (k > 2 && dCan < dRef) break;
      pts.push([x, y]); ldx = dx; ldy = dy;
    }
    // tiny colour jitter = more "hand painted"
    const jit = () => (Math.random() - .5) * 10;
    const c = col.map(v => Math.max(0, Math.min(255, Math.round(v + jit()))));
    strokes.push({ pts, hex: toHex(c[0], c[1], c[2]) });
  }
  // first layer: paint roughly top-to-bottom in loose bands, like a human blocking in
  if (first) strokes.sort((a, b) => (a.pts[0][1] + Math.random() * 300 * S) - (b.pts[0][1] + Math.random() * 300 * S));
  else shuffle(strokes);
  return strokes;
}

/* ---------- auto painter with animation timed to a total duration ---------- */
let running = false;
const FPS = MANUAL ? 30 : 60;
let tickResolve = null, waitingResolve = null;
function frame(){
  if (!MANUAL) return new Promise(requestAnimationFrame);
  return new Promise(r => { tickResolve = r; if (waitingResolve) { const w = waitingResolve; waitingResolve = null; w(); } });
}
// recorder calls __tick(): lets the painter draw one frame, resolves once it is drawn
window.__tick = () => new Promise(r => {
  if (window.__done) return r();
  waitingResolve = r; const t = tickResolve; tickResolve = null; if (t) t();
});
function finish(){
  running = false; cur.style.display = 'none'; window.__done = true;
  if (waitingResolve) { const w = waitingResolve; waitingResolve = null; w(); }
}
// share of total time per layer (big brushes get more screen time so viewers can follow)
const TIME_SHARE = [0.14, 0.14, 0.13, 0.12, 0.13, 0.12, 0.11, 0.11];
async function autoPaint(totalSec = 30){
  if (!refData) { alert('Load a reference image first'); return; }
  running = true; clearCanvas();
  for (let li = 0; li < SIZES.length && running; li++) {
    const R = SIZES[li];
    setBrush(R); setPass(PASS_OF(R));
    await new Promise(r => setTimeout(r, 30));
    const strokes = planLayer(R, li === 0);
    const frames = Math.max(1, Math.round(TIME_SHARE[li] * totalSec * FPS));
    const perFrame = Math.max(1, Math.ceil(strokes.length / frames));
    for (let i = 0; i < strokes.length && running; i += perFrame) {
      for (const s of strokes.slice(i, i + perFrame)) { setColor(s.hex); stroke(s.pts, { raw: true }); }
      await frame();
    }
  }
  setPass('Fine details');
  finish();                             // recorder waits for __done
}

/* ---------- replay strokes produced by an AI agent ----------
   list: [{size, color, points:[[x,y],...], pass?}, ...] */
async function replay(list, totalSec = 30){
  running = true; clearCanvas();
  const frames = Math.max(1, Math.round(totalSec * FPS));
  const perFrame = Math.max(1, Math.ceil(list.length / frames));
  for (let i = 0; i < list.length && running; i += perFrame) {
    for (const s of list.slice(i, i + perFrame)) {
      if (s.size !== state.size) setBrush(s.size);
      if (s.pass) setPass(s.pass); else setPass(PASS_OF(s.size));
      setColor(s.color); stroke(s.points);
    }
    await frame();
  }
  finish();
}

/* ---------- wiring ---------- */
document.getElementById('go').onclick = () => autoPaint(+document.getElementById('dur').value || 30);
document.getElementById('reset').onclick = () => { running = false; clearCanvas(); uiPass('Ready'); };
document.getElementById('save').onclick = () => {
  const a = document.createElement('a'); a.href = snapshot(); a.download = 'painting.png'; a.click();
};
const readFile = f => { const r = new FileReader(); r.onload = () => loadRef(r.result); r.readAsDataURL(f); };
document.getElementById('file').onchange = e => e.target.files[0] && readFile(e.target.files[0]);
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); e.dataTransfer.files[0] && readFile(e.dataTransfer.files[0]); });

// public API for an external AI agent (Playwright / CDP)
window.paint = { S, setBrush, setColor, setPass, stroke, clear: clearCanvas, snapshot, loadRef, autoPaint, replay,
  reference: referenceSmall, SIZES, W, H };

(async () => {
  if (params.get('ref')) {
    await loadRef(params.get('ref'));
    const dur = +params.get('dur') || 30, delay = +params.get('delay') || 800;
    if (params.get('strokes')) {
      const list = await (await fetch(params.get('strokes'))).json();
      setTimeout(() => replay(list, dur), delay);
    } else if (params.has('autostart')) setTimeout(() => autoPaint(dur), delay);
  }
  window.__ready = true;
})();
</script>
</body>
</html>
